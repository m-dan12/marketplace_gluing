# Профиль: Wildberries, кабинет Профтекс
platform = "wb"
cabinet = "skazka"

[limits]
max_group = 30        # жёсткий лимит WB: больше нельзя
work_group = 26       # рабочий лимит: новые склейки собираются до 26; существующая растёт до max_group (допуск 1–4 новых артикула)
min_group = 6         # меньше — выносим на лист проверки
soft_min_group = 10   # желаемый минимум

[rules]
fabric_category = "Ткани для рукоделия"
bedding_categories = ["Постельное белье", "Простыни", "Наволочки", "Пододеяльники"]
decor_pillowcase_category = "Наволочки декоративные"
carnival_category = "Карнавальные костюмы"
carnival_types = { "сарафан" = "сарафаны", "юбк" = "юбки", "плащ" = "плащи" }
# бренды, у которых вся категория склеивается вместе (без деления по ключам)
whole_category_brands = { "Сказка Сатин" = "категория максимально вместе", "Анна Мария" = "вся категория вместе" }
# бренды без эко-правила
no_eco_brands = ["Анна Мария"]
button_pillowcase_key = "0-0-263"
hotel_pillowcase_key = "0-0-260"
hotel_pillowcase_to = "0-0-26"
ruffle_ends = ["13", "17", "18"]       # последнее число ключа
ruffle_brands = ["Сказка"]             # рюши отдельно только у этих брендов
rhomb_first = ["44", "54"]             # ромбы: только свой ключ, отдельно от эко и обычных
rhomb_categories = ["Пододеяльники", "Постельное белье"]
# ромбы выше эко; детские выше эко (детский дизайн из списка эко остаётся в детских)
order = ["carnival", "decor", "whole_category", "button", "kant", "rhomb", "child", "eco_ruffle", "eco", "ruffle", "generic"]

# хвосты размеров: остатки меньше min_group объединяются с соседними размерами той же ветки, категории и бренда (смешение размеров допускается
# только так); ветки из mix_sizes_bids (вся категория бренда, карнавал, декоративные наволочки, KANT: правила проекта не делят их по ключу) не делятся по размеру совсем; семейства из no_mix_families не смешиваются никогда
merge_tails = true
size_split_up = 8        # размер отделяется в свою группу при >= 8 карточек (приоритет выше, чем у ветки: 10 у Озона)
size_merge_down = 6      # а если вчера был отделён, удерживается, пока карточек >= 6; остальные размеры — хвосты (склеиваются с соседними)
# ветка решается целиком по числу дизайнов, как на Озоне: детские и эко отделяются при >= branch_split_up (удерживаются >= branch_merge_down),
# иначе остаются в обычной ветке; признак (рюши, кант, ...) уходит в запасную, если в нём меньше feature_min_designs дизайнов
branch_split_up = 10
branch_merge_down = 8
feature_min_designs = 2
mix_sizes_bids = ["whole", "carnival", "decor", "kant"]
no_mix_families = ["rhomb"]
# КПБ: размерность (первое число ключа: 4 — 1,5-сп, 5 — 2-сп, 6 — евро, 8 — семейный, 1/2 — детские) не смешивается: хвосты и остатки
# склеиваются и распределяются только внутри своей размерности; бренды из lead_mix_brands остаются целиком (по ним мало остатков)
lead_types = ["Постельное белье"]
lead_mix_brands = ["Мечта"]

[solver]
# mode: "cpsat" — решатель (хвосты размеров и раскладка по частям, gluing/wb/cpsat.py); "greedy" — жадный. Нет ortools или он падает на процессоре
# (proftex-server) — автоматически жадный; поэтому план считается на laya-server.
mode = "cpsat"
time_limit = 10
deterministic_limit = 25   # лимит поиска на пару бренд+категория (условные единицы, результат повторяем)
workers = 8
gap = 0.01

[solver.weights]      # штрафы цели; больше вес — важнее
groups = 100          # каждая лишняя группа
small_min = 5000      # группа меньше min_group
small_soft = 300      # группа меньше soft_min_group
span = 120            # разброс ключей внутри группы (в «соседях»)
pair = 30             # лишнее дробление ключа между группами
spread = 5            # неравные размеры групп

[stock]
# остаток WB считаем только по «Склад WB РФ» (плюс FBS Селсапа и рулоны); all_physical — все физические склады, не используется
wb_mode = "wb_rf"
# Гистерезис по остатку: карточка без остатка остаётся в плане ещё столько дней после обнуления (как на Озоне).
grace_days = 3

[brands]
# приведение бренда карточки WB к бренду по префиксу (для сверки; бренд склейки берётся по префиксу)
wb_alias = { "Мечта!" = "Мечта", "TimeLess" = "Timeless", "TIMELESS" = "Timeless", "Сказка." = "Сказка", "MILKY GARDEN" = "Milky Garden" }

# Автоприменение плана на WB (ночная цепочка). Решение принимает предполётный отчёт (applier/wb_preflight.py): блокировка, устаревшие данные,
# нет токена склеек, превышение лимита операций или стоп-файл останавливают запись и присылают уведомление с причинами.
# Аварийный выключатель общий с Озоном: файл logs/AUTOAPPLY_OFF в корне проекта на proftex-server.
[autoapply]
enabled = true
max_ops = 1500
kill_file = "logs/AUTOAPPLY_OFF"

# Рекомендации продавца (tools/wb_recommend.py): до total артикулов на карточку с остатком, по слотам из slots (порядок слотов = порядок набора;
# что не набралось, добивается любыми карточками группы). Новинки (new) стоят первыми: в списке WB они идут в самом начале. rotation — из скольких лучших кандидатов на слот выбираем наименее использованных.
[recommend]
total = 20
rotation = 5
design_cap = 14          # «весь дизайн» не больше стольких (иначе не останется места под хиты и новинки)
cdp_port = 9222          # Chrome кабинета на proftex-server (как у автоответов на отзывы, marketplaces_auto_replies/config/accounts.py)
rows_per_file = 1000     # окно загрузки в Джеме принимает файл не больше 1000 строк (с шапкой)
decor_categories = ["Шторы интерьерные", "Скатерти", "Наволочки декоративные", "Дорожки кухонные", "Рушники"]
# Мечта рекомендуется только к Мечте; Сказка, Сказка Сатин и Анна Мария смешиваются; эко только с эко (определяется по спискам дизайнов)
brand_classes = [["Сказка", "Сказка Сатин", "Анна Мария"], ["Мечта"]]

[recommend.bedding]
slots = { new = 2, design = 8, top = 4, ruffle = 2, dead = 2, rhomb = 2 }

[recommend.decor]
slots = { new = 3, design = 8, top = 5, dead = 4 }
design_all = true
fill_same_category = true

[recommend.fabric]
slots = { new = 3, design = 10, top = 4, dead = 3 }
fill_same_category = true

[recommend.carnival]
slots = { new = 2, design = 8, top = 6, dead = 4 }
design_all = true
fill_same_category = true
