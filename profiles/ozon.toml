# Профиль: Озон (все кабинеты). Единица склейки — дизайн; дизайн не делится между склейками.
platform = "ozon"

[limits]
max_group = 18          # максимум дизайнов в склейке
min_group = 6           # минимум дизайнов для обычной склейки
small_group_min = 2     # малая склейка (меньше min_group, но не меньше этого) разрешена, если больше нечем дополнить

[stock]
# В склейки идут SKU, у которых остаток (Озон + отрезы из рулона) не меньше этого значения: 2 = «итого больше 1», 1 = «хотя бы 1».
min_total = 2
# Гистерезис по остатку: артикул, у которого остаток стал меньше min_total, остаётся в плане ещё столько дней
# (товар, который скоро вернётся, не прыгает из склейки и обратно). По истечении его снимают с модели (операция unglue_model).
grace_days = 7

[features]
# true: дизайн делится по признаку (рюши, ромбы, кант, пуговицы...): рюшевые артикулы идут в свою ветку, обычные в свою.
# false: признак дизайна — самый редкий из признаков его артикулов, дизайн целиком.
split_design = true
# Пороги отделения признака (рюши, ромбы, кант, пуговицы, уличные...). Единое правило: признак определяет ветку,
# порог лишь отсекает ветку из одного дизайна (ей не из чего составить группу, она уходит в запасную),
# merge_down = split_up: ветка из одного дизайна не удерживается и вчерашним решением. Остаток обычной ветки — не меньше small_group_min.
split_up = 2
merge_down = 2

# Определения признаков по типам товара. Правило: {name = признак, key/title/offer/prefix = регулярные выражения}.
# Условия внутри правила объединяются «и», правила идут по порядку, срабатывает первое; без совпадений — default.
# Поля: key — ключ артикула (цифры и дефисы, например 4-13-17), title — название карточки, offer — артикул целиком,
# prefix — префикс бренда. Регистр не учитывается. Новый признак (например «Новогодние» для скатертей, он зашит в ключ артикула,
# а в выгрузках площадок его нет) добавляется строкой правила, код менять не нужно.
# fallback — запасная ветка: куда уходит признак, если его мало (цепочки: кружево → рюши → обычные).
bed_types = ["Комплект постельного белья", "Пододеяльник", "Простыня", "Наволочка"]   # к ним применяются детские и эко
# приоритет признаков при split_design = false: сначала самые редкие
rarity = ["Новогодние", "Ромбы", "Пуговицы", "Рюши", "Кружево", "Уличные", "На липучках", "Кант", "С оборками",
          "Сарафаны", "Юбки", "Плащи"]

[features.types."Комплект постельного белья"]
default = "Обычные"
fallback = { "Рюши" = "Обычные", "Ромбы" = "Обычные" }
rules = [
  { name = "Ромбы", key = '^(44|54)(?!\d)' },
  { name = "Рюши", key = '^(?:\d+-){2,}(17|18|19)$' },
]

[features.types."Пододеяльник"]
default = "Обычные"
fallback = { "Ромбы" = "Обычные", "Кант" = "Обычные" }
rules = [
  { name = "Ромбы", key = '^(44|54)(?!\d)' },
  { name = "Кант", offer = 'kant' },
  { name = "Кант", title = 'кант' },
]

[features.types."Простыня"]
default = "Обычные"
fallback = { "С оборками" = "Обычные" }
rules = [
  { name = "С оборками", title = 'оборк|рюш' },
]

[features.types."Наволочка"]
default = "Обычные"
fallback = { "Кружево" = "Рюши", "Рюши" = "Обычные", "Кант" = "Обычные", "Пуговицы" = "Обычные" }
rules = [
  { name = "Пуговицы", key = '^0-0-263$' },
  { name = "Пуговицы", title = 'пуговиц' },
  { name = "Рюши", key = '^(?:\d+-){2,}(13|17|18|19)$' },
  { name = "Кружево", title = 'кружев' },
  { name = "Кант", offer = 'kant' },
  { name = "Кант", title = 'кант' },
]

[features.types."Штора"]
default = "Обычные"
fallback = { "На липучках" = "Обычные", "Уличные" = "Обычные" }
rules = [
  { name = "Уличные", prefix = '^(OK|GR)$' },
  { name = "Уличные", title = 'уличн' },
  { name = "На липучках", title = 'липуч' },
]

[features.types."Карнавальная одежда"]
default = "Прочее"
fallback = { "Сарафаны" = "Прочее", "Юбки" = "Прочее", "Плащи" = "Прочее" }
rules = [
  { name = "Сарафаны", title = 'сарафан' },
  { name = "Юбки", title = 'юбк' },
  { name = "Плащи", title = 'плащ' },
]

[features.types."Скатерть"]
default = "Обычные"
fallback = { "Новогодние" = "Обычные" }
rules = [
  { name = "Новогодние", key = '150$' },        # новогодняя линейка: длина 150 см в ключе артикула
]

[solver]
# Раскладка дизайнов ветки по частям (если ветка больше max_group): "cpsat" — решатель CP-SAT, "greedy" — прежняя жадная эвристика.
# Решатель: жёстко размеры min..max и близнецы не в одной части; в цель входят липкость, баланс силы, разброс размеров, хит+неликвид.
parts = "cpsat"
time_limit = 10          # детерминированное время CP-SAT на ветку, секунды

[solver.weights]         # штрафы цели; больше вес — важнее
move = 150               # дизайн сменил часть относительно вчерашнего дня
balance = 2              # разница силы между самой сильной и слабой частью, в промилле силы ветки
size = 15                # разница размеров частей, в дизайнах
mix = 200                # в части нет хита или нет неликвида

[hysteresis]
split_up = 10           # признак / детские / эко отделяются при ≥ этого числа дизайнов
merge_down = 8          # и сливаются обратно только при < этого числа (между 8 и 10 остаётся как вчера)

# бренд по префиксу артикула; PA — Анна Мария, но отдельной группой от AM
[brands]
PT = "Сказка"
GR = "Сказка"
OK = "Сказка"
PC = "Сказка Сатин"
MT = "Мечта"
AM = "Анна Мария AM"
PA = "Анна Мария PA"
MY = "Milky Garden"
MI = "Milky Garden"
KK = "Котики Котики"    # отдельный бренд в кабинете Milky Garden; склеивать с Milky Garden нельзя
"" = "Timeless"

# Бренд на Озоне (атрибут 85) по бренду плана. Истина — префикс артикула: карточки приводятся к этому значению операциями set_brand.
# Анна Мария на Озоне заведена как «Нет бренда» (документов на бренд пока нет, добавить бренд в справочник нельзя).
# Меняется только пустое значение и значения из этой таблицы; чужие бренды не трогаются (предупреждение).
[ozon_brand]
"Сказка" = "Сказка"
"Сказка Сатин" = "Сказка Сатин"
"Мечта" = "Мечта"
"Анна Мария AM" = "Нет бренда"
"Анна Мария PA" = "Нет бренда"
"Milky Garden" = "Milky Garden"
"Котики Котики" = "Котики Котики"
"Timeless" = "TIMELESS"
