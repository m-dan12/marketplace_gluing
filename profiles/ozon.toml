# Профиль: Озон (все кабинеты). Единица склейки — дизайн; дизайн не делится между склейками.
platform = "ozon"

[limits]
max_group = 18          # максимум дизайнов в склейке
min_group = 6           # минимум дизайнов для обычной склейки
small_group_min = 2     # малая склейка (меньше min_group, но не меньше этого) разрешена, если больше нечем дополнить

[stock]
# В склейки идут SKU, у которых остаток (Озон + отрезы из рулона) не меньше этого значения: 2 = «итого больше 1», 1 = «хотя бы 1».
min_total = 2

[features]
# true: дизайн делится по признаку (рюши, ромбы, кант, пуговицы...): рюшевые артикулы идут в свою ветку, обычные в свою.
# false: признак дизайна — самый редкий из признаков его артикулов, дизайн целиком.
split_design = true

# Признаки, которые отделяются всегда, при любом числе дизайнов (самостоятельный товар для покупателя).
# Для них не действуют пороги split_up/merge_down и запасные ветки; в итоге получится малая группа, если дизайнов мало.
[features.always_separate]
"Штора" = ["Уличные", "На липучках"]

[hysteresis]
split_up = 10           # признак / детские / эко отделяются при ≥ этого числа дизайнов
merge_down = 8          # и сливаются обратно только при < этого числа (между 8 и 10 остаётся как вчера)

# бренд по префиксу артикула; PA — Анна Мария, но отдельной группой от AM
[brands]
PT = "Сказка"
GR = "Сказка"
OK = "Сказка"
PC = "Сказка Сатин"
MT = "Мечта"
AM = "Анна Мария AM"
PA = "Анна Мария PA"
MY = "Milky Garden"
MI = "Milky Garden"
KK = "Milky Garden"
"" = "Timeless"
